<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard Financeiro Multi-Mês</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

<style>
  :root{
    --bg:#f3f4f6;
    --card:#ffffff;
    --text:#111827;
    --muted:#6b7280;
    --border:#e5e7eb;
    --dark:#111827;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family: Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:20px;
  }
  h1{margin-bottom:16px;font-size:28px}
  .topbar{
    display:flex; gap:12px; align-items:center; flex-wrap:wrap;
    margin-bottom:18px;
  }
  select, input{
    padding:10px 12px;
    border:1px solid #d1d5db;
    border-radius:10px;
    background:#fff;
    font-size:14px;
  }
  .tabs{display:flex; gap:10px; margin:18px 0 20px; flex-wrap:wrap;}
  .tab-btn{
    border:none; padding:11px 18px; border-radius:10px; cursor:pointer;
    background:#d1d5db; color:#111827; font-weight:700;
  }
  .tab-btn.active{background:var(--dark); color:#fff;}
  .section{display:none;}
  .section.active{display:block;}
  .cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(175px,1fr));
    gap:14px;
    margin-bottom:20px;
  }
  .card{
    background:var(--card);
    border-radius:16px;
    padding:16px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
  }
  .card h3{font-size:13px;color:var(--muted);margin-bottom:8px}
  .card p{font-size:22px;font-weight:700}
  .chart-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:18px;
    margin-bottom:22px;
  }
  .chart-card{
    background:var(--card);
    border-radius:16px;
    padding:18px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    min-height:380px;
  }
  .chart-card h3{margin-bottom:10px;font-size:16px}
  .chart-wrap{position:relative;height:320px}
  .table-container{
    background:var(--card);
    border-radius:16px;
    padding:18px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    overflow:auto;
  }
  .table-title{margin-bottom:12px;font-size:16px}
  table{width:100%;border-collapse:collapse;min-width:760px}
  th,td{padding:10px 8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}
  th{background:#111827;color:#fff;position:sticky;top:0}
  td input[type="date"]{width:150px}
  td select{min-width:160px}
  .empty{
    padding:18px;
    color:var(--muted);
    font-style:italic;
  }
  .hint{color:var(--muted);font-size:13px}
  @media (max-width:768px){
    body{padding:14px}
    h1{font-size:24px}
    .chart-card{min-height:320px}
    .chart-wrap{height:280px}
  }
</style>
</head>
<body>

<h1>Dashboard Financeiro Multi-Mês</h1>

<div class="topbar">
  <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" />
  <select id="monthSelector" disabled></select>
  <button onclick="exportClassifiedWorkbook()">Exportar Planilha Classificada</button><span class="hint">Cada aba do Excel vira um mês.</span>
</div>

<div class="tabs">
  <button class="tab-btn active" data-tab="mensal">Análise Mensal</button>
  <button class="tab-btn" data-tab="comparativo">Comparativo Mensal</button>
</div>

<div id="mensal" class="section active">
  <div class="cards" id="summaryCards"></div>

  <div class="chart-grid">
    <div class="chart-card">
      <h3>Distribuição por Categoria</h3>
      <div class="chart-wrap"><canvas id="pieChart"></canvas></div>
    </div>

    <div class="chart-card">
      <h3>Gastos Semanais</h3>
      <div class="chart-wrap"><canvas id="weeklyChart"></canvas></div>
    </div>
  </div>

  <div class="table-container">
    <h3 class="table-title">Transações</h3>
    <table>
      <thead>
        <tr>
          <th>Data</th>
          <th>Categoria</th>
          <th>Descrição</th>
          <th>Valor</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div id="comparativo" class="section">
  <div class="chart-grid">
    <div class="chart-card">
      <h3>Total por Mês</h3>
      <div class="chart-wrap"><canvas id="monthlyTotalChart"></canvas></div>
    </div>

    <div class="chart-card">
      <h3>Gastos por Categoria (agrupado)</h3>
      <div class="chart-wrap"><canvas id="groupedChart"></canvas></div>
    </div>

    <div class="chart-card">
      <h3>Share por Categoria (%)</h3>
      <div class="chart-wrap"><canvas id="shareChart"></canvas></div>
    </div>
  </div>
</div>

<script>
const categories = ["restaurantes", "supermercado", "farmácia", "academia", "outros", "desconsiderar"];

let dataByMonth = {};
let currentMonth = "";
let pieChart, weeklyChart, monthlyTotalChart, groupedChart, shareChart;
let editingMonth = "";
let editingIndex = null;

function showTab(tabId, btn){
  document.querySelectorAll(".section").forEach(el => el.classList.remove("active"));
  document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
  document.getElementById(tabId).classList.add("active");
  btn.classList.add("active");
}

document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", e => showTab(btn.dataset.tab, btn));
});

function parseMoney(v){
  if(v === null || v === undefined || v === "") return 0;
  if(typeof v === "number") return v;
  const s = String(v).replace(/\s/g,"").replace("R$","").replace(/\./g,"").replace(",",".");
  const n = Number(s);
  return Number.isFinite(n) ? n : 0;
}

function excelSerialToDate(serial){
  const utcDays = Math.floor(serial - 25569);
  const utcValue = utcDays * 86400;
  const dateInfo = new Date(utcValue * 1000);
  return new Date(dateInfo.getUTCFullYear(), dateInfo.getUTCMonth(), dateInfo.getUTCDate());
}

function pad2(n){ return String(n).padStart(2, "0"); }

function dateToISO(date){
  return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
}

function dateToDisplay(date){
  return `${pad2(date.getDate())}/${pad2(date.getMonth() + 1)}/${date.getFullYear()}`;
}

function parseExcelDate(value){
  if(value === null || value === undefined || value === "") return null;

  if(value instanceof Date && !isNaN(value.getTime())) return value;

  if(typeof value === "number" && isFinite(value)){
    return excelSerialToDate(value);
  }

  const s = String(value).trim();

  // yyyy-mm-dd
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(m){
    const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    return isNaN(d.getTime()) ? null : d;
  }

  // dd/mm/yyyy or dd-mm-yyyy
  m = s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})$/);
  if(m){
    let y = Number(m[3]);
    if(y < 100) y += 2000;
    const d = new Date(y, Number(m[2]) - 1, Number(m[1]));
    return isNaN(d.getTime()) ? null : d;
  }

  const d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}

function autoCategory(desc){
  desc = (desc || "").toString().toUpperCase();

  if(desc.includes("PAGAMENTOS VALIDOS NORMAIS")) return "desconsiderar";
  if(desc.includes("IFOOD") || desc.includes("BURGER") || desc.includes("MCDON") || desc.includes("RESTAUR")) return "restaurantes";
  if(desc.includes("PAO") || desc.includes("SUPERM") || desc.includes("MERCADO") || desc.includes("ATACAD")) return "supermercado";
  if(desc.includes("DROGA") || desc.includes("FARM") || desc.includes("SAUDE")) return "farmácia";
  if(desc.includes("ACADEM") || desc.includes("SMART")) return "academia";
  return "outros";
}

function normalizeRow(row){
  const keys = Object.keys(row || {});
  const dataRaw = row["Data"] ?? row["DATA"] ?? row[keys[0]];
  const descRaw = row["Estabelecimento"] ?? row["Descrição"] ?? row["Descricao"] ?? row[keys[1]];
  const valorRaw = row["Valor"] ?? row["VALOR"] ?? row[keys[2]];

  const parsedDate = parseExcelDate(dataRaw);
  const iso = parsedDate ? dateToISO(parsedDate) : "";
  const display = parsedDate ? dateToDisplay(parsedDate) : (dataRaw ? String(dataRaw) : "");

  return {
    dateRaw: dataRaw ?? "",
    dateISO: iso,
    dateDisplay: display,
    descricao: descRaw ?? "",
    valor: parseMoney(valorRaw),
    categoria: autoCategory(descRaw ?? "")
  };
}

function processWorkbook(workbook){
  dataByMonth = {};
  workbook.SheetNames.forEach(sheetName => {
    const sheet = workbook.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });
    dataByMonth[sheetName] = rows.map(normalizeRow);
  });

  const months = Object.keys(dataByMonth);
  const selector = document.getElementById("monthSelector");
  selector.innerHTML = months.map(m => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join("");
  selector.disabled = months.length === 0;

  currentMonth = months[0] || "";
  selector.value = currentMonth;

  renderAll();
}

function escapeHtml(text){
  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll("\"", "&quot;")
    .replaceAll("'", "&#39;");
}

function getCurrentData(){
  return dataByMonth[currentMonth] || [];
}

function updateMonthSelector(){
  const selector = document.getElementById("monthSelector");
  selector.addEventListener("change", function(){
    currentMonth = this.value;
    renderAll();
  });
}

function updateDate(index, newISO){
  const item = getCurrentData()[index];
  if(!item) return;
  item.dateISO = newISO || "";
  if(newISO){
    const [y, m, d] = newISO.split("-").map(Number);
    const date = new Date(y, m - 1, d);
    item.dateDisplay = dateToDisplay(date);
    item.dateRaw = newISO;
  } else {
    item.dateDisplay = "";
    item.dateRaw = "";
  }
  renderAll();
}

function updateCategory(index, newCategory){
  const item = getCurrentData()[index];
  if(!item) return;
  item.categoria = newCategory;
  renderAll();
}

function renderCards(data){
  const summary = {};
  categories.forEach(c => { if(c !== "desconsiderar") summary[c] = 0; });

  data.forEach(it => {
    if(it.categoria !== "desconsiderar") summary[it.categoria] += it.valor;
  });

  const total = Object.values(summary).reduce((a,b) => a + b, 0);
  const div = document.getElementById("summaryCards");
  div.innerHTML = "";

  div.innerHTML += `
    <div class="card">
      <h3>Total</h3>
      <p>R$ ${total.toFixed(2)}</p>
    </div>
  `;

  Object.entries(summary)
    .sort((a,b) => b[1] - a[1])
    .forEach(([cat, val]) => {
      div.innerHTML += `
        <div class="card">
          <h3>${escapeHtml(cat)}</h3>
          <p>R$ ${val.toFixed(2)}</p>
        </div>
      `;
    });
}

function renderTable(data){
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";

  if(!data.length){
    tbody.innerHTML = `<tr><td colspan="4" class="empty">Nenhuma transação encontrada.</td></tr>`;
    return;
  }

  data.forEach((it, i) => {
    tbody.innerHTML += `
      <tr>
        <td>${escapeHtml(it.dateDisplay)}</td>
        <td>
          <select onchange="updateCategory(${i}, this.value)">
            ${categories.map(c => `
              <option value="${escapeHtml(c)}" ${c === it.categoria ? "selected" : ""}>${escapeHtml(c)}</option>
            `).join("")}
          </select>
        </td>
        <td>${escapeHtml(it.descricao)}</td>
        <td>R$ ${it.valor.toFixed(2)}</td>
      </tr>
    `;
  });
}

function renderPieChart(data){
  const summary = {};
  categories.forEach(c => { if(c !== "desconsiderar") summary[c] = 0; });
  data.forEach(it => { if(it.categoria !== "desconsiderar") summary[it.categoria] += it.valor; });

  if(pieChart) pieChart.destroy();

  pieChart = new Chart(document.getElementById("pieChart"), {
    type: "pie",
    data: {
      labels: Object.keys(summary),
      datasets: [{ data: Object.values(summary) }]
    },
    plugins: [ChartDataLabels],
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        datalabels: {
          formatter: (value, ctx) => {
            const total = ctx.chart.data.datasets[0].data.reduce((a, b) => a + b, 0);
            if(!total) return "";
            return ((value / total) * 100).toFixed(1) + "%";
          }
        }
      }
    }
  });
}

function weekStart(date){
  const d = new Date(date);
  const day = d.getDay(); // 0 = domingo
  d.setDate(d.getDate() - day);
  d.setHours(0,0,0,0);
  return d;
}

function weekLabel(date){
  const start = weekStart(date);
  const end = new Date(start);
  end.setDate(start.getDate() + 6);
  return `${pad2(start.getDate())}/${pad2(start.getMonth()+1)} - ${pad2(end.getDate())}/${pad2(end.getMonth()+1)}`;
}

function renderWeeklyChart(data){
  const weekly = {};
  const validRows = data.filter(it => it.categoria !== "desconsiderar" && it.dateISO);

  validRows.forEach(it => {
    const d = parseExcelDate(it.dateISO);
    if(!d) return;
    const label = weekLabel(d);
    if(!weekly[label]){
      weekly[label] = {};
      categories.forEach(c => { if(c !== "desconsiderar") weekly[label][c] = 0; });
    }
    weekly[label][it.categoria] += it.valor;
  });

  const labels = Object.keys(weekly);

  if(weeklyChart) weeklyChart.destroy();

  if(!labels.length){
    weeklyChart = new Chart(document.getElementById("weeklyChart"), {
      type: "bar",
      data: { labels: ["Sem dados de data"], datasets: [{ label: "Total", data: [0] }] },
      options: { responsive: true, maintainAspectRatio: false }
    });
    return;
  }

  const datasets = categories
    .filter(c => c !== "desconsiderar")
    .map(cat => ({
      label: cat,
      data: labels.map(l => weekly[l][cat] || 0),
      stack: "stack1"
    }));

  weeklyChart = new Chart(document.getElementById("weeklyChart"), {
    type: "bar",
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: { stacked: true },
        y: { stacked: true }
      }
    }
  });
}

function renderComparativeCharts(){
  const months = Object.keys(dataByMonth);

  const totalByMonth = months.map(month => (
    (dataByMonth[month] || [])
      .filter(x => x.categoria !== "desconsiderar")
      .reduce((acc, it) => acc + it.valor, 0)
  ));

  if(monthlyTotalChart) monthlyTotalChart.destroy();
  monthlyTotalChart = new Chart(document.getElementById("monthlyTotalChart"), {
    type: "bar",
    data: {
      labels: months,
      datasets: [{ label: "Total", data: totalByMonth }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false
    }
  });

  const groupedDatasets = categories
    .filter(c => c !== "desconsiderar")
    .map(cat => ({
      label: cat,
      data: months.map(month => (
        (dataByMonth[month] || [])
          .filter(x => x.categoria === cat)
          .reduce((acc, it) => acc + it.valor, 0)
      ))
    }));

  if(groupedChart) groupedChart.destroy();
  groupedChart = new Chart(document.getElementById("groupedChart"), {
    type: "bar",
    data: { labels: months, datasets: groupedDatasets },
    options: {
      responsive: true,
      maintainAspectRatio: false
    }
  });

  const shareDatasets = categories
    .filter(c => c !== "desconsiderar")
    .map(cat => ({
      label: cat,
      data: months.map((month, idx) => {
        const total = totalByMonth[idx];
        const catTotal = (dataByMonth[month] || [])
          .filter(x => x.categoria === cat)
          .reduce((acc, it) => acc + it.valor, 0);
        return total ? +(catTotal / total * 100).toFixed(1) : 0;
      })
    }));

  if(shareChart) shareChart.destroy();
  shareChart = new Chart(document.getElementById("shareChart"), {
    type: "bar",
    data: { labels: months, datasets: shareDatasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: { stacked: true },
        y: { stacked: true, max: 100 }
      }
    }
  });
}

function renderAll(){
  const data = getCurrentData();
  renderCards(data);
  renderTable(data);
  renderPieChart(data);
  renderWeeklyChart(data);
  renderComparativeCharts();
}

document.getElementById("fileInput").addEventListener("change", function(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;

  const name = file.name.toLowerCase();

  if(name.endsWith(".csv")){
    const reader = new FileReader();
    reader.onload = function(evt){
      const text = evt.target.result;
      const wb = XLSX.read(text, { type: "string" });
      processWorkbook(wb);
      updateMonthSelector();
    };
    reader.readAsText(file, "utf-8");
    return;
  }

  const reader = new FileReader();
  reader.onload = function(evt){
    const wb = XLSX.read(evt.target.result, { type: "binary", cellDates: true });
    processWorkbook(wb);
    updateMonthSelector();
  };
  reader.readAsBinaryString(file);
});


function exportClassifiedWorkbook(){

  if(Object.keys(dataByMonth).length === 0){
    alert("Carregue um arquivo primeiro.");
    return;
  }

  const wb = XLSX.utils.book_new();

  Object.keys(dataByMonth).forEach(month => {

    const rows = dataByMonth[month].map(item => ({
      Data: item.dateDisplay,
      Categoria: item.categoria,
      Estabelecimento: item.descricao,
      Valor: item.valor
    }));

    const ws = XLSX.utils.json_to_sheet(rows);

    XLSX.utils.book_append_sheet(wb, ws, month);

  });

  XLSX.writeFile(wb, "fatura_classificada.xlsx");

}


(function init(){
  updateMonthSelector();
})();
</script>
</body>
</html>
